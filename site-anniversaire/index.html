<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chargement…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,700&family=JetBrains+Mono:wght@400;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ivoire:#f3eee4;--encre:#1d1c19;--or:#b08d3c;--or2:#d6b866;--gris:#8a8374;--carte:#fbf8f1}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:'Figtree',sans-serif;color:var(--encre);background:var(--ivoire);overflow-x:hidden}
.mono,h2{font-family:'JetBrains Mono',monospace}
.page{position:relative;z-index:2;min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}
.page.active{display:flex;animation:fondu .8s ease both}
@keyframes fondu{from{opacity:0}to{opacity:1}}
@keyframes apparait{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* ciel : ballons et poussière dorée */
#ciel{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1;transition:opacity 1s}
#ciel.calme{opacity:.25}
.ballon{position:absolute;bottom:-190px;width:var(--t);height:calc(var(--t)*1.25);border-radius:50% 50% 46% 46%/55% 55% 45% 45%;
 background:radial-gradient(ellipse 18% 12% at 30% 24%,rgba(255,255,255,.8),transparent 100%),radial-gradient(ellipse 60% 50% at 68% 82%,rgba(0,0,0,.28),transparent 100%),var(--c);
 box-shadow:inset -6px -8px 14px rgba(0,0,0,.2),0 8px 14px rgba(40,30,10,.18);animation:monte var(--d) linear var(--delai) infinite}
.ballon::before{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:11px;background:var(--c);transform:translateX(-50%);clip-path:polygon(50% 0,100% 100%,0 100%);filter:brightness(.8)}
.ballon::after{content:"";position:absolute;left:50%;top:calc(100% + 3px);width:1.5px;height:80px;background:linear-gradient(rgba(60,50,30,.5),transparent);transform:translateX(-50%)}
.bp{position:absolute;bottom:-45vh;width:var(--t);height:auto;filter:drop-shadow(0 10px 12px rgba(40,30,10,.25));animation:monte var(--d) linear var(--delai) infinite}
@keyframes monte{0%{transform:translate(0,0) rotate(-3deg)}25%{transform:translate(20px,-32vh) rotate(3deg)}50%{transform:translate(-16px,-64vh) rotate(-3deg)}75%{transform:translate(18px,-96vh) rotate(3deg)}100%{transform:translate(0,-150vh) rotate(-2deg)}}
.dore{position:absolute;bottom:-12px;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#ecd58f,#b08d3c 70%);opacity:0;animation:flotte var(--d) ease-in var(--delai) infinite}
@keyframes flotte{0%{transform:translateY(0);opacity:0}15%{opacity:.75}100%{transform:translateY(-105vh) translateX(var(--dx));opacity:0}}

/* 1. chargement : photo de l'ordinateur */
#chargement{padding:0;background:#cbc7b8}
.fond{position:absolute;inset:-6%;width:112%;height:112%;object-fit:cover;filter:blur(26px)}
.cadre{position:relative;z-index:1;width:min(100vw,1050px);aspect-ratio:3/2}
.photo{display:block;width:100%;height:100%;-webkit-mask-image:radial-gradient(ellipse 76% 82% at 50% 52%,#000 66%,transparent 100%);mask-image:radial-gradient(ellipse 76% 82% at 50% 52%,#000 66%,transparent 100%)}
.fil{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.prise{animation:branche 1.4s cubic-bezier(.2,.8,.3,1) .5s both}
@keyframes branche{from{transform:translate(170px,120px);opacity:0}to{transform:none;opacity:1}}
.logo{position:absolute;left:54.8%;top:33.6%;width:10%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 65%);opacity:0;animation:allume 2.2s ease-in-out 1.9s infinite alternate both}
@keyframes allume{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:.85;transform:translate(-50%,-50%) scale(1.15)}}
.main{position:absolute;left:66%;bottom:84%;width:11.5%;z-index:3;opacity:0;animation:poigne 2.8s ease-in-out 2.1s forwards;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.main img{display:block;width:100%;transform:rotate(172deg)}
@keyframes poigne{0%{opacity:0;transform:translate(8%,-90%)}20%{opacity:1;transform:none}34%{transform:none}70%{opacity:1;transform:translate(-4%,-18%)}100%{opacity:0;transform:translate(-4%,-120%)}}
.charge{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:min(70%,300px);text-align:center;font:400 .95rem 'JetBrains Mono',monospace;letter-spacing:.14em;color:#25302b;opacity:0;animation:fondu .6s ease 3.2s forwards}
.pts::after{content:"";animation:pts 1.2s steps(1) infinite}
@keyframes pts{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.piste{height:2px;margin-top:12px;background:rgba(0,0,0,.18)}
.piste i{display:block;height:100%;width:0;background:var(--or);animation:remplit 4s linear 3.2s forwards}
@keyframes remplit{to{width:100%}}

/* 2. scène : bureau */
.moniteur{position:relative;width:min(88vw,520px);height:min(34vh,230px);border:7px solid #17181c;border-radius:12px;background:#101216;box-shadow:0 0 0 2px #7c7a72,0 22px 44px rgba(40,30,10,.35);padding:16px;text-align:left;overflow:hidden}
.moniteur::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.09),transparent 40%)}
.pied{width:120px;height:34px;background:linear-gradient(90deg,#8d8a80,#d6d2c6 50%,#8d8a80);clip-path:polygon(40% 0,60% 0,68% 68%,100% 100%,0 100%,32% 68%)}
.ligne{display:flex;gap:6px;height:8px;margin:8px 0}
.ligne i{height:100%;border-radius:4px;background:var(--c);width:0;animation:ecrit .5s ease-out forwards;animation-delay:calc(var(--n)*.16s)}
@keyframes ecrit{to{width:var(--w)}}
.bureau{display:flex;align-items:flex-end;gap:28px;margin-top:22px}
.clavier{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;width:min(58vw,360px);padding:10px;background:linear-gradient(#26272c,#17181c);border-radius:10px;box-shadow:0 14px 26px rgba(40,30,10,.4);transform:perspective(500px) rotateX(22deg)}
.touche{aspect-ratio:1;border-radius:4px;background:linear-gradient(#4a4d55,#2e3036);box-shadow:0 3px 0 #131418,0 4px 5px rgba(0,0,0,.45),inset 0 1px 0 #6a6e78;transition:transform .08s}
.touche.claire{background:linear-gradient(#ece8dc,#c9c4b5);box-shadow:0 3px 0 #7d7a70,0 4px 5px rgba(0,0,0,.45),inset 0 1px 0 #fff}
.touche.on{transform:translateY(3px);background:linear-gradient(#f0d98f,#b08d3c);box-shadow:0 0 12px rgba(214,184,102,.8)}
.tasse{width:min(34vw,150px);animation:bob 4s ease-in-out infinite}
.tasse img{display:block;width:100%;filter:drop-shadow(0 10px 10px rgba(40,30,10,.3))}
@keyframes bob{50%{transform:translateY(-7px)}}

/* 3. terminal */
.terminal{width:100%;max-width:520px;background:#14161b;border-radius:12px;text-align:left;overflow:hidden;box-shadow:0 28px 60px rgba(40,30,10,.35),0 0 0 1px #2a2d36;animation:apparait .7s ease-out both;font-family:'JetBrains Mono',monospace}
.t-barre{display:flex;align-items:center;gap:8px;padding:11px 14px;background:linear-gradient(#2c2f38,#1f2229);color:#9a9a92;font-size:.78rem}
.t-barre i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.t-barre i:nth-child(2){background:#febc2e}.t-barre i:nth-child(3){background:#28c840}
.t-barre span{margin:0 auto;transform:translateX(-24px)}
.t-corps{padding:18px 18px 22px;min-height:300px;font-size:.92rem;line-height:1.7;color:#e6e1d3;cursor:text}
.t-corps p{margin:0;min-height:1.7em;word-break:break-word}
.t-or{color:#d6b866}.t-gris{color:#7d8190}.t-ok{color:#7fd29a}.t-ko{color:#ff7b72}
.t-saisie{display:none;gap:8px;align-items:baseline;margin-top:2px;padding:2px 6px;margin-left:-6px;border-radius:4px}
.t-saisie:focus-within{background:rgba(214,184,102,.08)}
.t-saisie label{color:#d6b866;white-space:nowrap}
.t-saisie input{flex:1;min-width:0;background:transparent;border:0;padding:0;color:#fff;font:inherit;caret-color:#d6b866;outline:none}
.t-saisie input::placeholder{color:#575c6b}
.t-prog{display:inline-block;width:12ch;height:.6em;background:#2a2d36;vertical-align:middle;border-radius:2px;overflow:hidden}
.t-prog i{display:block;height:100%;width:0;background:#d6b866;animation:remplit 1.2s linear forwards}
button{font:700 1rem 'JetBrains Mono',monospace;cursor:pointer;border:0;border-radius:8px;padding:14px;margin-top:14px;background:var(--encre);color:var(--or2);transition:transform .15s}
button:active{transform:scale(.98)}
button.sec{background:transparent;color:var(--encre);text-decoration:underline;width:auto;padding:8px;font-weight:400}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}

/* 4. voeux : lettres qui descendent une à une */
#fete{justify-content:flex-start;padding-top:9vh;overflow:visible}
.mot{display:inline-flex}
.mot span{display:inline-block;opacity:0;color:var(--c);animation:chute 1.1s linear forwards;animation-delay:calc(var(--i)*var(--pas,.2s) + var(--base,0s))}
@keyframes chute{
 0%{opacity:0;transform:translateY(-85vh);animation-timing-function:ease-in}8%{opacity:1}
 55%{transform:translateY(0);animation-timing-function:ease-out}72%{transform:translateY(-14px);animation-timing-function:ease-in}
 86%{transform:translateY(0);animation-timing-function:ease-out}93%{transform:translateY(-3px);animation-timing-function:ease-in}100%{opacity:1;transform:none}}
.titre-fete,.prenom-fete,.profite{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .3em;line-height:1.2}
.titre-fete{font-size:clamp(2.6rem,12vw,5.2rem)}
.prenom-fete{font-size:clamp(1.5rem,6.5vw,2.5rem);margin:14px 0 28px;min-height:1.3em}
.voeux{list-style:none;padding:0;width:min(100%,640px);display:flex;flex-direction:column-reverse;gap:12px;--dx:clamp(12px,4.6vw,38px)} /* retire "column-reverse" pour un escalier qui descend */
.voeux li{position:relative;margin-left:calc(var(--n)*var(--dx));width:calc(100% - var(--nmax)*var(--dx));background:var(--carte);border-bottom:3px solid var(--or);border-radius:4px 4px 0 0;padding:13px 18px;text-align:left;line-height:1.5;box-shadow:0 10px 22px rgba(60,45,10,.1);opacity:0;transform:translateY(14px);transition:opacity .8s,transform .8s}
.voeux li::before{content:"";position:absolute;left:calc(-1*var(--dx));bottom:-3px;width:var(--dx);height:3px;background:var(--or)}
.voeux li:first-child::before{display:none}
.voeux li.on{opacity:1;transform:none}

/* 5. gâteau + message */
.plaque{position:relative;width:min(86vw,460px);background:var(--ivoire);animation:apparait 1s ease-out both}
.plaque img{display:block;width:100%;mix-blend-mode:multiply}
.plaque svg{position:absolute;inset:0;width:100%;height:100%}
.flamme-g{transform-box:fill-box;transform-origin:50% 100%;animation:vacille .45s ease-in-out infinite alternate}
@keyframes vacille{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.1) rotate(3deg)}}
.lueur{animation:lueur 1.1s ease-in-out infinite alternate}
@keyframes lueur{from{opacity:.7}to{opacity:1}}
.eteinte .flamme-g{animation:none;transform:scale(0);opacity:0;transition:transform .5s,opacity .5s}
.eteinte .lueur{animation:none;opacity:0;transition:opacity .8s}
.fumee-b{opacity:0}.eteinte .fumee-b{animation:fume 2.6s ease-out forwards}
@keyframes fume{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
.profite{display:none;font-size:clamp(1.9rem,8vw,3.2rem);margin:26px 0 8px}
.profite.vue{display:flex}
.profite .mot span{animation:chute 1.1s linear forwards,vague 2s ease-in-out infinite;animation-delay:calc(var(--i)*var(--pas,.2s) + var(--base,0s)),calc(var(--i)*var(--pas,.2s) + var(--base,0s) + 1.1s)}
@keyframes vague{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.rejouer{display:none;margin-bottom:50px}.rejouer.vue{display:block;animation:apparait .8s ease-out both}
@media (prefers-reduced-motion:reduce){.ballon,.bp,.dore,.flamme-g,.lueur{animation:none}.mot span{animation-duration:.01s}}
</style>
</head>
<body>
<div id="ciel" aria-hidden="true"></div>

<!-- 1. CHARGEMENT -->
<main class="page active" id="chargement">
  <img class="fond" src="ordi.jpg" alt="" aria-hidden="true">
  <div class="cadre" role="img" aria-label="Un chargeur se branche à un ordinateur portable, une main l'effleure">
    <img class="photo" src="ordi.jpg" alt="">
    <svg class="fil" viewBox="0 0 1050 700" aria-hidden="true">
      <g class="prise">
        <path d="M1070 715C1000 640 900 540 770 462" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="8" stroke-linecap="round" transform="translate(4 7)"/>
        <path d="M1070 715C1000 640 900 540 770 462" fill="none" stroke="#f6f6f2" stroke-width="5.5" stroke-linecap="round"/>
        <g transform="translate(748 455) rotate(25)">
          <rect x="-4" y="-5" width="26" height="10" rx="3" fill="#ecece8" stroke="#b3b3ad" stroke-width=".8"/>
          <rect x="-18" y="-3.2" width="15" height="6.4" rx="2" fill="#8d9097"/>
        </g>
      </g>
    </svg>
    <div class="logo"></div>
    <div class="main" aria-hidden="true"><img src="main.png" alt=""></div>
    <div class="charge"><p>Chargement<span class="pts"></span></p><div class="piste"><i></i></div></div>
  </div>
</main>

<!-- 2. SCÈNE -->
<main class="page" id="scene" aria-hidden="true">
  <div class="moniteur"><div id="code"></div></div>
  <div class="pied"></div>
  <div class="bureau">
    <div class="clavier" id="clavier"></div>
    <div class="tasse"><img src="tasse.png" alt="Tasse de café avec éclaboussures et grains"></div>
  </div>
</main>

<!-- 3. FORMULAIRE -->
<main class="page" id="formulaire">
  <div class="terminal" role="application" aria-label="Terminal de saisie">
    <div class="t-barre"><i></i><i></i><i></i><span>anniversaire — zsh</span></div>
    <div class="t-corps" id="tCorps">
      <div id="sortie" aria-live="polite"></div>
      <form class="t-saisie" id="tForm" novalidate>
        <label for="tIn" id="tLabel"></label>
        <input id="tIn" autocomplete="off" autocapitalize="off" spellcheck="false">
      </form>
    </div>
  </div>
</main>

<!-- 4. VOEUX -->
<main class="page" id="fete">
  <h1 class="titre-fete" id="titre" aria-label="Happy Birthday"></h1>
  <p class="prenom-fete" id="prenomFete"></p>
  <ul class="voeux" id="voeux"></ul>
</main>

<!-- 5. GÂTEAU + MESSAGE -->
<main class="page" id="gateau">
  <div class="plaque" id="plaque">
    <img src="gateau.jpg" alt="Gâteau d'anniversaire à la crème, cerises et amandes">
    <svg viewBox="0 0 777 1000" aria-hidden="true">
      <defs>
        <linearGradient id="cire" x1="0" x2="1"><stop offset="0" stop-color="#c9a24a"/><stop offset=".4" stop-color="#f6e7b8"/><stop offset="1" stop-color="#a98230"/></linearGradient>
        <linearGradient id="feu" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a00"/><stop offset=".6" stop-color="#ffb347"/><stop offset="1" stop-color="#ffe9a0"/></linearGradient>
        <radialGradient id="lueurG"><stop offset="0" stop-color="#ffb347" stop-opacity=".6"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
        <filter id="flou"><feGaussianBlur stdDeviation="2.4"/></filter>
      </defs>
      <ellipse cx="448" cy="590" rx="15" ry="4.5" fill="#000" opacity=".28"/>
      <rect x="441" y="496" width="14" height="94" rx="3" fill="url(#cire)"/>
      <path d="M441 514l14-6M441 534l14-6M441 554l14-6M441 574l14-6" stroke="#8a6a22" stroke-width="3" opacity=".7"/>
      <path d="M448 496v-9" stroke="#2a2118" stroke-width="2.2" stroke-linecap="round"/>
      <path class="fumee-b" d="M448 478q-13-16 0-32t0-32" stroke="#bdb6a6" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#flou)"/>
      <circle class="lueur" cx="448" cy="462" r="74" fill="url(#lueurG)"/>
      <g class="flamme-g">
        <path d="M448 436C457 456 466 468 448 490 430 468 439 456 448 436Z" fill="url(#feu)"/>
        <path d="M448 456C453 466 455 474 448 486 441 474 443 466 448 456Z" fill="#fff3b8" opacity=".92"/>
        <ellipse cx="448" cy="485" rx="3.6" ry="5" fill="#4a7dff" opacity=".8"/>
      </g>
    </svg>
  </div>
  <p class="profite" id="profite" aria-label="Profite bien de ta journée"></p>
  <button class="sec rejouer" id="rejouer" type="button">Revoir l'animation</button>
</main>

<script>
const $=id=>document.getElementById(id);
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const COUL=['#c9a24a','#1d1c19','#efe9dc','#b08d3c','#2c2b28'];
const test=false;
const cap=s=>s.trim().toLowerCase().replace(/(^|[\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
const aller=id=>{document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));scrollTo(0,0)};
const rnd=(a,b)=>a+Math.random()*(b-a);

function ballons(n){for(let i=0;i<n;i++){const b=document.createElement('div');b.className='ballon';
  b.style.cssText='--c:'+COUL[i%5]+';--t:'+rnd(46,76)+'px;--d:'+rnd(11,19)+'s;--delai:-'+rnd(0,16)+'s;left:'+rnd(0,94)+'%';$('ciel').appendChild(b)}}
function ballonsPhoto(n){const src=['ballon-or.png','ballon-noir.png','ballon-blanc.png'];for(let i=0;i<n;i++){const b=document.createElement('img');b.className='bp';b.alt='';b.src=src[i%3];
  b.style.cssText='--t:'+rnd(80,130)+'px;--d:'+rnd(16,26)+'s;--delai:-'+rnd(0,22)+'s;left:'+rnd(0,90)+'%';$('ciel').appendChild(b)}}
function poussiere(n){for(let i=0;i<n;i++){const p=document.createElement('div');p.className='dore';
  p.style.cssText='--s:'+rnd(3,7)+'px;--d:'+rnd(7,13)+'s;--delai:-'+rnd(0,12)+'s;--dx:'+rnd(-40,40)+'px;left:'+rnd(0,98)+'%';$('ciel').appendChild(p)}}
/* lettres : chaque lettre tombe l'une après l'autre (base = départ, pas = écart entre lettres) */
function mots(el,texte,couleurs,base,pas){el.innerHTML='';el.style.setProperty('--base',base);el.style.setProperty('--pas',pas);let k=0;
  texte.split(' ').forEach(m=>{const w=document.createElement('span');w.className='mot';w.setAttribute('aria-hidden','true');
    [...m].forEach(l=>{const s=document.createElement('span');s.textContent=l;s.style.cssText='--i:'+k+';--c:'+couleurs[k%couleurs.length];k++;w.appendChild(s)});el.appendChild(w)})}

/* ---- 1 -> 2 : 4 s de "Chargement" ---- */
setTimeout(scene,7300);
let tClavier;
function scene(){
  aller('scene');ballons(14);poussiere(24);
  const code=$('code'),cs=['#d6b866','#f3eee4','#8a8374','#b08d3c','#c9c3b4'];let n=0;
  for(let l=0;l<9;l++){const li=document.createElement('div');li.className='ligne';li.style.marginLeft=(l%3)*5+'%';
    for(let s=0;s<2+l%2;s++){const i=document.createElement('i');i.style.cssText='--c:'+cs[(l+s*2)%5]+';--w:'+rnd(14,40)+'%;--n:'+(n++);li.appendChild(i)}code.appendChild(li)}
  const cl=$('clavier');for(let k=0;k<56;k++){const t=document.createElement('b');t.className='touche'+(k%9===4?' claire':'');cl.appendChild(t)}
  tClavier=setInterval(()=>{const t=cl.children[Math.floor(Math.random()*56)];t.classList.add('on');setTimeout(()=>t.classList.remove('on'),140)},110);
  setTimeout(()=>{clearInterval(tClavier);$('ciel').classList.add('calme');aller('formulaire');demarrerTerminal()},6200);
}

/* ---- 3 : terminal ---- */
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function moisNum(v){v=norm(v);if(/^\d{1,2}$/.test(v))return +v>=1&&+v<=12?+v:0;return MOIS.findIndex(m=>norm(m)===v||(v.length>=3&&norm(m).startsWith(v)))+1}
const ETAPES=[
 {k:'prenom',q:'prénom',h:'ex. Awa',ok:v=>v.trim().length>=2,err:'Prénom trop court.'},
 {k:'nom',q:'nom',h:'ex. Ouedraogo',ok:v=>v.trim().length>=2,err:'Nom trop court.'},
 {k:'jour',q:'jour de naissance',h:'1 à 31',ok:v=>/^\d{1,2}$/.test(v.trim())&&+v>=1&&+v<=31,err:'Entre un jour entre 1 et 31.'},
 {k:'mois',q:'mois de naissance',h:'1-12 ou nom (août)',ok:v=>moisNum(v)>0,err:'Mois inconnu : tape un numéro (1-12) ou un nom.'}];
const rep={};let etapeT=0,occupe=false;
function ligne(html,cls){const p=document.createElement('p');if(cls)p.className=cls;p.innerHTML=html;$('sortie').appendChild(p);return p}
function taper(el,txt,cb){let i=0;const t=setInterval(()=>{el.textContent=txt.slice(0,++i);if(i>=txt.length){clearInterval(t);cb&&cb()}},24)}
function demarrerTerminal(){
  $('sortie').innerHTML='';etapeT=0;occupe=true;$('tForm').style.display='none';
  ligne('<span class="t-or">$</span> <span id="cmd"></span>');
  taper($('cmd'),'./anniversaire --start',()=>{ligne('Bienvenue. Quelques questions avant de commencer.','t-gris');ligne('');question()});
}
function question(){const e=ETAPES[etapeT];$('tLabel').innerHTML='<span class="t-gris">?</span> '+e.q+' :';$('tIn').value='';$('tIn').placeholder=e.h;
  $('tForm').style.display='flex';occupe=false;$('tIn').focus({preventScroll:true})}
$('tCorps').addEventListener('click',()=>{if(!occupe)$('tIn').focus()});
$('tForm').addEventListener('submit',e=>{e.preventDefault();if(occupe)return;
  const et=ETAPES[etapeT],v=$('tIn').value;
  if(!et.ok(v)){ligne('<span class="t-ko">✖</span> '+et.err);return}
  rep[et.k]=v.trim();ligne('<span class="t-ok">✔</span> '+et.q+' : <span class="t-or">'+esc(v.trim())+'</span>');
  if(++etapeT<ETAPES.length)return question();
  verifier()});
function verifier(){
  occupe=true;$('tForm').style.display='none';
  const j=+rep.jour,m=moisNum(rep.mois);
  if(j>new Date(2024,m,0).getDate()){ligne('<span class="t-ko">✖</span> Cette date n\'existe pas. Corrige le jour et le mois.');etapeT=2;return setTimeout(question,600)}
  ligne('');ligne('<span class="t-or">$</span> vérification de la date <span class="t-prog"><i></i></span>');
  setTimeout(()=>{const a=new Date();
    if(test||(a.getDate()===j&&a.getMonth()+1===m)){ligne('<span class="t-ok">✔</span> Date confirmée. Ouverture…');setTimeout(lancer,1200)}
    else{ligne('<span class="t-ko">✖</span> Ce n\'est pas ton anniversaire aujourd\'hui. Reviens le '+j+' '+MOIS[m-1]+'.');ligne('');ligne('Tu peux corriger la date de naissance.','t-gris');etapeT=2;setTimeout(question,900)}},1400);
}

/* ---- 4 : voeux, puis 5 : gâteau ---- */
const VOEUX=["Que cette nouvelle année t'apporte santé, force et sérénité.","Que tes idées prennent vie et que tes projets réussissent.","Que la joie t'accompagne chaque jour, même les plus ordinaires.","Que tes efforts soient reconnus et récompensés.","Que les personnes qui comptent soient toujours près de toi.","Que le meilleur reste à venir, et qu'il arrive vite."]; /* ajoute autant de voeux que tu veux : l'escalier s'adapte */
const OR=['#1d1c19','#b08d3c'];
let mn=[];const plus=(f,ms)=>mn.push(setTimeout(f,ms));
function lancer(){
  mn.forEach(clearTimeout);mn=[];document.title='Happy Birthday !';aller('fete');
  const c=$('ciel');c.innerHTML='';c.classList.remove('calme');ballonsPhoto(9);poussiere(18);
  mots($('titre'),'Happy Birthday',OR,'.3s','.17s');                                                        /* lettre par lettre */
  mots($('prenomFete'),cap(rep.prenom)+' '+rep.nom.toUpperCase(),['#b08d3c'],'3.6s','.07s');
  const ul=$('voeux');ul.innerHTML='';ul.style.setProperty('--nmax',VOEUX.length-1);
  VOEUX.forEach((v,i)=>{const li=document.createElement('li');li.textContent=v;li.style.setProperty('--n',i);ul.appendChild(li);plus(()=>li.classList.add('on'),6000+i*1200)});
  plus(gateauPage,6000+(VOEUX.length-1)*1200+2600);                                                                                    /* nouvelle page après les voeux */
}
function gateauPage(){
  aller('gateau');
  const p=$('plaque'),pr=$('profite'),r=$('rejouer');
  p.classList.remove('eteinte');pr.classList.remove('vue');r.classList.remove('vue');
  mots(pr,'Profite bien de ta journée',OR,'0s','.1s');
  plus(()=>p.classList.add('eteinte'),4000);                                                                 /* bougie éteinte 3 s après l'apparition */
  plus(()=>{pr.classList.add('vue');pr.scrollIntoView({behavior:'smooth',block:'center'})},4800);
  plus(()=>r.classList.add('vue'),8200);
}
$('rejouer').addEventListener('click',lancer);
</script>
